<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zerix — Login / Register</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
        .auth-container { width: 100%; max-width: 400px; padding: 2rem; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .auth-logo { display: flex; justify-content: center; margin-bottom: 2rem; }
        .auth-title { font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 0.5rem; letter-spacing: -0.03em; }
        .auth-desc { font-size: 0.875rem; color: var(--text-muted); text-align: center; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .form-group input { width: 100%; padding: 0.75rem 1rem; background: var(--bg); border: 1px solid var(--border-light); border-radius: 8px; color: var(--text-main); font-size: 0.875rem; outline: none; transition: border-color 0.2s; }
        .form-group input:focus { border-color: var(--primary); }
        .btn-full { width: 100%; padding: 0.75rem; font-size: 0.875rem; }
        .alert { display: none; padding: 1rem; border-radius: 8px; font-size: 0.875rem; margin-bottom: 1.5rem; text-align: center; }
        .alert.success { display: block; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: var(--success); }
        .alert.error { display: block; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: var(--danger); }
        .back-link { display: block; text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted); }
        .back-link:hover { color: var(--text-main); }
    </style>
</head>
<body>

    <div class="auth-container animate-up">
        <div class="auth-logo">
            <a href="index.html" class="logo" style="font-size: 1.5rem;"><div class="logo-icon"></div> Zerix</a>
        </div>
        <h1 class="auth-title">Create an Account</h1>
        <p class="auth-desc">Enter your email to generate an API key and access your dashboard.</p>

        <div id="alert-box" class="alert"></div>

        <form id="register-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@company.com" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="submit-btn">Generate API Key</button>
        </form>

        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script>
        // Jika sudah punya API key, langsung ke dashboard
        if (localStorage.getItem('zerix_api_key') && localStorage.getItem('zerix_api_key') !== 'dev_mode') {
            window.location.href = 'dashboard.html';
        }

        const form = document.getElementById('register-form');
        const alertBox = document.getElementById('alert-box');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            
            submitBtn.innerText = "Generating...";
            submitBtn.disabled = true;
            alertBox.className = "alert";

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (response.ok) {
                    alertBox.className = "alert success";
                    alertBox.innerText = "Success! Redirecting to dashboard...";
                    
                    // Simpan API Key di browser
                    localStorage.setItem('zerix_api_key', data.api_key);
                    localStorage.setItem('zerix_email', email);
                    
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    throw new Error(data.error || "Registration failed");
                }
            } catch (error) {
                alertBox.className = "alert error";
                alertBox.innerText = error.message;
                submitBtn.innerText = "Generate API Key";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
