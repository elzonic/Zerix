[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zerix"
version = "0.1.0"
description = "Policy-enforcing middleware wallet for AI agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "elzonic" }]
license = { text = "Apache-2.0" }
keywords = ["ai", "agents", "wallet", "security", "langchain", "openai", "web3"]
dependencies = []

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/elzonic/Zerix"
Documentation = "https://github.com/elzonic/Zerix/blob/main/README.md"
Issues = "https://github.com/elzonic/Zerix/issues"

[tool.setuptools.packages.find]
include = ["zerix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
